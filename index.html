<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aprende IA con Claude</title>
  <meta name="description" content="Curso de inteligencia artificial desde cero, en español, usando la voz. Aprende a usar Claude paso a paso.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>">
</head>
<body>
  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <header class="barra" role="banner">
    <a class="marca" href="#/"><span class="logo" aria-hidden="true">🎙️</span> Aprende IA con Claude</a>
    <button class="boton-barra" id="btn-inicio" title="Volver al mapa del curso" aria-label="Volver al inicio">🏠 <span class="txt">Inicio</span></button>
    <button class="boton-barra" id="btn-menos" title="Letra más pequeña" aria-label="Letra más pequeña">A−</button>
    <button class="boton-barra" id="btn-mas" title="Letra más grande" aria-label="Letra más grande">A+</button>
    <button class="boton-barra" id="btn-tema" title="Cambiar colores" aria-label="Cambiar colores">🌓 <span class="txt">Colores</span></button>
    <button class="boton-barra" id="btn-velocidad" title="Velocidad de la voz" aria-label="Velocidad de la voz">🐢 <span class="txt">Voz lenta</span></button>
    <button class="boton-barra" id="btn-callar" title="Detener la voz" aria-label="Detener la voz">⏹️ <span class="txt">Callar</span></button>
  </header>

  <main id="contenido" tabindex="-1"></main>

  <script src="lecciones.js"></script>
  <script src="app.js"></script>
</body>
</html>
